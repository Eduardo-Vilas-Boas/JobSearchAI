# Runs before every `git commit`; the commit is aborted if any hook fails.
# One-time setup per clone: `uv run pre-commit install`.
# The tests need the local Postgres running (`docker compose up -d`).
# Skip in an emergency with `git commit --no-verify`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: pytest
        name: pytest (full suite, live tests excluded)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
