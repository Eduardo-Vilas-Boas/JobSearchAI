# Target companies for ATS ingestion (Section 1).
#
# Each entry's `board_token` was verified live against the ATS's public
# board API (the same endpoint the company uses to embed jobs on its own
# careers page) before being added here. Add new companies the same way:
# confirm `GET <api_base>/<board_token>` returns 200 before committing.
#
# ats: one of greenhouse, lever (more ATS types land as fetchers are added)

companies:
  - name: Proton
    ats: greenhouse
    board_token: proton
    canton_hint: GE  # Geneva

  - name: Scandit
    ats: greenhouse
    board_token: scandit
    canton_hint: ZH  # Zurich

  - name: Squirro
    ats: greenhouse
    board_token: squirro
    canton_hint: ZH  # Zurich

  - name: DFINITY
    ats: greenhouse
    board_token: dfinity
    canton_hint: ZH  # Zurich

  - name: SonarSource
    ats: lever
    board_token: sonarsource
    canton_hint: GE  # Geneva

  - name: ANYbotics
    ats: lever
    board_token: anybotics
    canton_hint: ZH  # Zurich

  - name: Gravis Robotics
    ats: lever
    board_token: gravisrobotics
    canton_hint: ZH  # Zurich

  - name: Auterion
    ats: greenhouse
    board_token: auterion
    canton_hint: ZH  # Zurich

  - name: Anthropic
    ats: greenhouse
    board_token: anthropic
    canton_hint: ZH  # Zurich office; the board lists all offices worldwide

# Companies whose postings are skipped, never stored: consultancies and
# recruitment agencies that post on behalf of clients. Matched against the
# company named on each posting, ignoring case and spacing, so list each
# spelling a board uses. Has no effect on the ATS boards above, which only
# list their own company's jobs; it applies to boards that list several
# companies' jobs.
blocked_companies: []
