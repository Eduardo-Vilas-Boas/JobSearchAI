services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "127.0.0.1:5432:5432"  # this machine only, not the local network
    volumes:
      - jobfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Guard review page: http://localhost:8501
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      # Same database as the CLI, reached by service name inside compose.
      JOBFIT_DATABASE_URL: postgresql+psycopg://jobfit:jobfit@postgres:5432/jobfit
    ports:
      - "127.0.0.1:8501:8501"  # this machine only, not the local network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jobfit_pgdata:
