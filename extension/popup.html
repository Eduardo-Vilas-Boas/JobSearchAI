<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 12px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 8px 0; }
    dt { color: #666; }
    dd { margin: 0; overflow-wrap: anywhere; }
    button { width: 100%; padding: 6px; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    #message { margin: 8px 0 0; }
    .error { color: #b00020; }
    .ok { color: #1b5e20; }
    .warn { color: #8a5a00; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>jobfit capture</h1>
  <dl id="fields" hidden>
    <dt>Title</dt><dd id="title"></dd>
    <dt>Company</dt><dd id="company"></dd>
    <dt>Location</dt><dd id="location"></dd>
    <dt>Posted</dt><dd id="posted"></dd>
    <dt>Description</dt><dd id="description"></dd>
  </dl>
  <button id="save" disabled>Save posting</button>
  <p id="message">Reading the page…</p>
  <script src="popup.js"></script>
</body>
</html>
