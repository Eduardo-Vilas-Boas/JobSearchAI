[project]
name = "jobfit"
version = "0.1.0"
description = "Swiss AI Job-Fit Ranker — ingestion, extraction and ranking pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "lingua-language-detector>=2.0",
    "datasketch>=1.6",
    "streamlit>=1.67.0",
    "presidio-analyzer>=2.2.358",
    "presidio-anonymizer>=2.2.358",
    "transformers>=4.51,<5",
    "torch>=2.6",
    "geonamescache>=3.0.2",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "dateparser>=1.5.1",
]

[dependency-groups]
# Just what the guard review page needs (src/jobfit/ui), so its Docker image
# doesn't pull torch and the guard's models. Also in `dependencies` above.
ui = [
    "streamlit>=1.67.0",
    "pandas",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfit"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by `alembic revision --autogenerate`; not hand-edited.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit real ATS APIs; opt in with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: hits real external APIs (deselected by default)"]
